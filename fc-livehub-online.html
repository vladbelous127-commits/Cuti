<style>
/* Dark is the default ground; light is applied by OS preference or an
   explicit data-theme on the root element, which must win either way. */
:root {
  --bg: #0b0b10;
  --bg-soft: #12121a;
  --card: #16161f;
  --line: #262633;
  --text: #f2f2f6;
  --muted: #9a9aab;
  --accent: #ff3d81;
  --accent-2: #8b5cf6;
  --radius: 14px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #ffffff; --bg-soft: #f6f6f9; --card: #ffffff; --line: #e5e5ec;
    --text: #14141c; --muted: #66667a;
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --bg-soft: #f6f6f9; --card: #ffffff; --line: #e5e5ec;
  --text: #14141c; --muted: #66667a;
}
:root[data-theme="dark"] {
  --bg: #0b0b10; --bg-soft: #12121a; --card: #16161f; --line: #262633;
  --text: #f2f2f6; --muted: #9a9aab;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
.wrap { width: min(1120px, 92vw); margin-inline: auto; }

/* ---- header ---- */
header {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.bar { display: flex; align-items: center; gap: 16px; height: 62px; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; font-weight: 800; letter-spacing: -.02em; font-size: 20px; }
.brand span { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.bar nav { margin-left: auto; display: flex; gap: 20px; font-size: 14px; color: var(--muted); }
.bar nav a { text-decoration: none; }
.bar nav a:hover { color: var(--text); }
@media (max-width: 720px) { .bar nav { display: none; } }

/* ---- hero ---- */
.hero { padding: 72px 0 56px; border-bottom: 1px solid var(--line);
  background:
    radial-gradient(900px 380px at 12% -10%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
    radial-gradient(700px 340px at 88% 0%, color-mix(in srgb, var(--accent-2) 20%, transparent), transparent 70%);
}
.eyebrow { font-size: 12px; letter-spacing: .16em; color: var(--accent); font-weight: 700; margin: 0 0 14px; }
.hero h1 { margin: 0 0 14px; font-size: clamp(32px, 6vw, 56px); line-height: 1.05; letter-spacing: -.03em; max-width: 16ch; }
.hero p { margin: 0 0 28px; color: var(--muted); max-width: 52ch; font-size: 17px; }
.btns { display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 12px 22px; border-radius: 999px; text-decoration: none;
  font-weight: 650; font-size: 15px; border: 1px solid transparent; cursor: pointer;
}
.btn-primary { background: linear-gradient(100deg, var(--accent), var(--accent-2)); color: #fff; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { border-color: var(--line); color: var(--text); background: transparent; }
.btn-ghost:hover { background: var(--bg-soft); }

/* ---- controls ---- */
.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 40px 0 20px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 7px 15px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer;
}
.chip:hover { color: var(--text); }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }
.search {
  margin-left: auto; padding: 9px 15px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--bg-soft); color: var(--text);
  font: inherit; font-size: 14px; min-width: 200px;
}
.search::placeholder { color: var(--muted); }
@media (max-width: 640px) { .search { margin-left: 0; width: 100%; } }

/* ---- event list ---- */
h2 { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; font-weight: 700; }
.list { display: grid; gap: 12px; margin: 0 0 24px; padding: 0; list-style: none; }
.event {
  display: grid;
  grid-template-columns: 78px 1fr auto;
  gap: 20px; align-items: center;
  padding: 18px 20px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  transition: border-color .15s, transform .15s;
}
.event:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); transform: translateY(-1px); }
.date { text-align: center; border-right: 1px solid var(--line); padding-right: 16px; }
.date .mon { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.date .day { font-size: 26px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; }
.date .dow { font-size: 11px; color: var(--muted); }
.meta h3 { margin: 0 0 3px; font-size: 17px; letter-spacing: -.01em; }
.meta .artist { color: var(--accent); font-weight: 650; }
.meta .sub { color: var(--muted); font-size: 14px; }
.meta .note { color: var(--muted); font-size: 13px; margin-top: 6px; opacity: .85; }
.right { text-align: right; display: grid; gap: 8px; justify-items: end; }
.price { font-size: 14px; color: var(--muted); }
.price b { color: var(--text); font-size: 16px; }
.tag { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px; border: 1px solid; }
.tag.green  { color: #34d399; border-color: #34d39955; background: #34d39914; }
.tag.violet { color: #a78bfa; border-color: #a78bfa55; background: #a78bfa14; }
.tag.grey   { color: var(--muted); border-color: var(--line); }
.tag.red    { color: #f87171; border-color: #f8717155; background: #f8717114; }
.buy { padding: 9px 18px; font-size: 14px; }
.buy[data-disabled="true"] { opacity: .4; pointer-events: none; }
@media (max-width: 720px) {
  .event { grid-template-columns: 62px 1fr; }
  .date { padding-right: 12px; }
  .right { grid-column: 1 / -1; justify-items: start; text-align: left;
           border-top: 1px solid var(--line); padding-top: 12px;
           grid-auto-flow: column; align-items: center; justify-content: space-between; width: 100%; }
}
.empty { padding: 48px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

/* ---- faq + footer ---- */
.faq { margin: 56px 0; display: grid; gap: 10px; }
details { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 12px; padding: 15px 18px; }
details summary { cursor: pointer; font-weight: 650; }
details p { color: var(--muted); margin: 10px 0 0; font-size: 15px; }
footer { border-top: 1px solid var(--line); padding: 44px 0 56px; margin-top: 40px; }
.fcols { display: flex; gap: 56px; flex-wrap: wrap; margin-bottom: 32px; }
.fcol h4 { margin: 0 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.fcol a { display: block; text-decoration: none; font-size: 14px; padding: 3px 0; color: var(--text); }
.fcol a:hover { color: var(--accent); }
.fnote { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 20px; }

/* ---- checkout ---- */
.co-grid { display: grid; grid-template-columns: 1fr 380px; gap: 28px; align-items: start; margin: 40px 0 64px; }
@media (max-width: 900px) { .co-grid { grid-template-columns: 1fr; } }
.back { display: inline-block; margin: 28px 0 0; color: var(--muted); text-decoration: none; font-size: 14px; }
.back:hover { color: var(--text); }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
.panel + .panel { margin-top: 16px; }
.panel h3 { margin: 0 0 4px; font-size: 16px; letter-spacing: -.01em; }
.panel .hint { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
.step { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 0 0 6px; }

.tier { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.tier + .tier { margin-top: 10px; }
.tier:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.tier:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
.tier:has(input:disabled) { opacity: .45; cursor: not-allowed; }
.tier input { accent-color: var(--accent); width: 17px; height: 17px; margin: 0; }
.tier .t-name { font-weight: 650; font-size: 15px; }
.tier .t-note { color: var(--muted); font-size: 13px; }
.tier .t-price { font-weight: 700; font-variant-numeric: tabular-nums; }

.qty { display: flex; align-items: center; gap: 14px; }
.qty button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg-soft); color: var(--text); font-size: 19px; line-height: 1; cursor: pointer; }
.qty button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.qty button:disabled { opacity: .35; cursor: not-allowed; }
.qty output { font-size: 19px; font-weight: 700; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.qty .max { color: var(--muted); font-size: 13px; }

.fields { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.field input { padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg-soft); color: var(--text); font: inherit; font-size: 15px; width: 100%; }
.field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.two-up { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .two-up { grid-template-columns: 1fr; } }

.summary { position: sticky; top: 82px; }
.sum-event { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 16px; }
.sum-event .artist { color: var(--accent); font-weight: 700; font-size: 15px; }
.sum-event .title { font-size: 14px; margin-top: 2px; }
.sum-event .where { color: var(--muted); font-size: 13px; margin-top: 8px; line-height: 1.7; }
.rows { display: grid; gap: 10px; font-size: 14px; }
.row { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); }
.row span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
.total { display: flex; justify-content: space-between; align-items: baseline;
  border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; font-weight: 700; }
.total .amt { font-size: 24px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.summary .btn { width: 100%; margin-top: 18px; }
.terms { color: var(--muted); font-size: 12px; margin: 12px 0 0; text-align: center; line-height: 1.6; }

.notice { border: 1px dashed var(--line); border-radius: 12px; padding: 16px 18px;
  color: var(--muted); font-size: 14px; line-height: 1.65; background: var(--bg-soft); }
.notice b { color: var(--text); }
.blocked { text-align: center; padding: 56px 24px; }
.blocked h2 { font-size: 22px; letter-spacing: -.01em; text-transform: none; color: var(--text); margin-bottom: 10px; }
.blocked p { color: var(--muted); margin: 0 0 22px; }

/* ---- bank transfer confirmation ---- */
.pending { max-width: 640px; margin: 40px auto 64px; }
.pending-head { text-align: center; margin-bottom: 26px; }
.pending-head .mark { width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 16px;
  display: grid; place-items: center; font-size: 24px;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); }
.pending-head h2 { font-size: 25px; letter-spacing: -.02em; text-transform: none;
  color: var(--text); margin: 0 0 8px; }
.pending-head p { color: var(--muted); margin: 0; }

.callout { display: grid; gap: 4px; text-align: center; padding: 20px;
  border-radius: 12px; margin-bottom: 16px;
  background: color-mix(in srgb, var(--accent) 8%, transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.callout .k { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.callout .v { font-size: 27px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.callout .v.ref { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 24px; letter-spacing: .04em; }
.callout .sub { color: var(--muted); font-size: 13px; }

.bank { width: 100%; border-collapse: collapse; font-size: 14px; }
.bank th, .bank td { text-align: left; padding: 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.bank tr:last-child th, .bank tr:last-child td { border-bottom: 0; }
.bank th { color: var(--muted); font-weight: 600; width: 42%; }
.bank td { font-weight: 600; font-variant-numeric: tabular-nums; }

.copy { border: 1px solid var(--line); background: var(--bg-soft); color: var(--muted);
  border-radius: 8px; padding: 5px 11px; font: inherit; font-size: 12px; cursor: pointer; margin-left: 10px; }
.copy:hover { color: var(--accent); border-color: var(--accent); }

.steps { list-style: none; counter-reset: s; padding: 0; margin: 0; display: grid; gap: 14px; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 13px;
  align-items: start; font-size: 14px; color: var(--muted); }
.steps li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; font-size: 12px; font-weight: 700;
  background: var(--bg-soft); border: 1px solid var(--line); color: var(--text); }
.steps b { color: var(--text); display: block; font-weight: 650; }

.warn { border-left: 3px solid var(--accent); background: var(--bg-soft);
  border-radius: 0 10px 10px 0; padding: 14px 16px; font-size: 13.5px;
  color: var(--muted); line-height: 1.65; }
.warn b { color: var(--text); }

</style>
</head>

let CURRENT_ID = null;

const Home = (() => {
const escH = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

const moneyH = (amount, currency) =>
  new Intl.NumberFormat('en', { style: 'currency', currency, maximumFractionDigits: 0 }).format(amount);

let activeFilter = 'all', query = '';


function boot() {
  const { site, statuses, faq } = DATA;

  document.title = site.title;
  const desc = document.querySelector('meta[name=description]');
  if (desc) desc.content = site.description;
  document.getElementById('brand').innerHTML =
    `${escH(site.brand)} <span>${escH(site.tagline)}</span>`;

  document.getElementById('heroEyebrow').textContent = site.hero.eyebrow;
  document.getElementById('heroHeading').textContent = site.hero.heading;
  document.getElementById('heroSub').textContent = site.hero.sub;
  document.getElementById('heroBtns').innerHTML = `
    <a class="btn btn-primary" href="${escH(site.hero.primaryCta.href)}">${escH(site.hero.primaryCta.label)}</a>
    <a class="btn btn-ghost" href="${escH(site.hero.secondaryCta.href)}">${escH(site.hero.secondaryCta.label)}</a>`;

  // Filters: All + one per status + one per genre.
  const filters = [
    { key: 'all', label: 'All events' },
    ...Object.entries(statuses).map(([key, s]) => ({ key: 'status:' + key, label: s.label })),
    ...DATA.genres.map(g => ({ key: 'genre:' + g, label: g })),
  ];
  document.getElementById('filters').innerHTML = filters.map(f =>
    `<button class="chip" data-key="${escH(f.key)}" aria-pressed="${f.key === 'all'}">${escH(f.label)}</button>`
  ).join('');

  document.getElementById('filters').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    activeFilter = btn.dataset.key;
    document.querySelectorAll('.chip').forEach(c =>
      c.setAttribute('aria-pressed', c === btn));
    render();
  });

  document.getElementById('search').addEventListener('input', e => {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  document.getElementById('faqList').innerHTML = faq.map(f =>
    `<details><summary>${escH(f.q)}</summary><p>${escH(f.a)}</p></details>`).join('');

  document.getElementById('fcols').innerHTML = site.footer.columns.map(col => `
    <div class="fcol">
      <h4>${escH(col.title)}</h4>
      ${col.links.map(l => `<a href="${escH(l.href)}">${escH(l.label)}</a>`).join('')}
    </div>`).join('');
  document.getElementById('fnote').textContent =
    `© ${new Date().getFullYear()} ${site.brand}. ${site.footer.note}`;

  render();
}

function matches(ev) {
  if (activeFilter.startsWith('status:') && ev.status !== activeFilter.slice(7)) return false;
  if (activeFilter.startsWith('genre:') && ev.genre !== activeFilter.slice(6)) return false;
  if (!query) return true;
  return [ev.artist, ev.title, ev.venue, ev.city, ev.genre]
    .join(' ').toLowerCase().includes(query);
}

function render() {
  const shown = DATA.events
    .filter(matches)
    .sort((a, b) => a.date.localeCompare(b.date));

  document.getElementById('count').textContent =
    shown.length ? `${shown.length} event${shown.length > 1 ? 's' : ''}` : '';

  document.getElementById('list').innerHTML = shown.length
    ? shown.map(card).join('')
    : '<li class="empty">No events match those filters.</li>';
}

function card(ev) {
  const d = new Date(ev.date + 'T00:00:00');
  const status = DATA.statuses[ev.status] ?? { label: ev.status, tone: 'grey' };
  const closed = ev.status === 'soldout' || ev.status === 'soon';
  const cta = ev.status === 'lottery' ? 'Enter lottery'
            : ev.status === 'soldout' ? 'Sold out'
            : ev.status === 'soon'    ? 'Not yet on sale'
            : 'Buy tickets';
  // Closed events keep a dead link; the rest carry their id into checkout.
  const href = closed ? '#' : `#/checkout/${encodeURIComponent(ev.id)}`;

  return `
  <li class="event">
    <div class="date">
      <div class="mon">${d.toLocaleString('en', { month: 'short' })}</div>
      <div class="day">${d.getDate()}</div>
      <div class="dow">${d.toLocaleString('en', { weekday: 'short' })} ${d.getFullYear()}</div>
    </div>
    <div class="meta">
      <h3><span class="artist">${escH(ev.artist)}</span> — ${escH(ev.title)}</h3>
      <div class="sub">${escH(ev.venue)}, ${escH(ev.city)} · Doors ${escH(ev.doors)} / Start ${escH(ev.start)}</div>
      ${ev.note ? `<div class="note">${escH(ev.note)}</div>` : ''}
    </div>
    <div class="right">
      <span class="tag ${escH(status.tone)}">${escH(status.label)}</span>
      <span class="price">from <b>${escH(moneyH(ev.priceFrom, ev.currency))}</b></span>
      <a class="btn btn-primary buy" href="${escH(href)}" data-disabled="${closed}">${cta}</a>
    </div>
  </li>`;
}
return { boot };
})();

const Checkout = (() => {
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

const money = (amount, currency) =>
  new Intl.NumberFormat('en', { style: 'currency', currency, maximumFractionDigits: 0 }).format(amount);

let EVENT, tierId, qty = 1;


function boot() {
  const { site } = DATA;
  document.getElementById('brand').innerHTML =
    `${esc(site.brand)} <span>${esc(site.tagline)}</span>`;
  document.getElementById('fnote').textContent =
    `© ${new Date().getFullYear()} ${site.brand}. ${site.footer.note}`;

  const id = CURRENT_ID;
  EVENT = DATA.events.find(e => e.id === id);

  if (!EVENT) return blocked(
    'Event not found',
    id ? `No event matches “${id}”. It may have been removed.` : 'No event was selected.');

  document.title = `${EVENT.artist} — Checkout — ${site.brand}`;

  if (EVENT.status === 'soldout') return blocked(
    'This event is sold out',
    'Tickets may return through official resale if other buyers release seats.');

  if (EVENT.status === 'soon') return blocked(
    'Not on sale yet',
    EVENT.note || 'The on-sale date for this event has not been announced.');

  tierId = EVENT.tiers[0].id;
  renderCheckout();
}

function blocked(heading, message) {
  document.getElementById('main').innerHTML = `
    <div class="blocked">
      <h2>${esc(heading)}</h2>
      <p>${esc(message)}</p>
      <a class="btn btn-primary" href="#/">Browse other events</a>
    </div>`;
}

function renderCheckout() {
  const ev = EVENT;

  const d = new Date(ev.date + 'T00:00:00');

  document.getElementById('main').innerHTML = `

              <input id="fname" name="fname" autocomplete="given-name" required>
            </div>
            <div class="field">
              <label for="lname">Last name</label>
              <input id="lname" name="lname" autocomplete="family-name" required>
            </div>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel">
          </div>
        </div>
      </div>

      <div class="panel">
        <p class="step">Step 4</p>
        <h3>Payment by bank transfer</h3>
        <p class="hint">${isLottery
          ? 'Nothing to pay now. If your entry wins, we send transfer details with the result.'
          : `You will get an account number and a reference on the next screen. Transfer within ${DATA.payment.deadlineHours} hours to keep your seats.`}</p>
        <ul class="steps">
          <li><span><b>Place your order</b>We reserve the seats and issue a payment reference.</span></li>
          <li><span><b>Transfer the total</b>From your bank, quoting the reference in the memo.</span></li>
          <li><span><b>We confirm and send tickets</b>Usually within one business day of the transfer clearing.</span></li>
        </ul>
      </div>
    </form>

    <aside class="panel summary">
      <div class="sum-event">
        <div class="artist">${esc(ev.artist)}</div>
        <div class="title">${esc(ev.title)}</div>
        <div class="where">
          ${esc(when)}<br>
          ${esc(ev.venue)}, ${esc(ev.city)}<br>
          Doors ${esc(ev.doors)} · Start ${esc(ev.start)}
        </div>
      </div>
      <div class="rows" id="rows"></div>
      <div class="total"><span>Total</span><span class="amt" id="total"></span></div>
      <button class="btn btn-primary" type="submit" form="form" id="submit"></button>
      <p class="terms" id="terms"></p>
    </aside>
  </div>`;

  document.getElementById('tiers').innerHTML = ev.tiers.map(t => `
    <label class="tier">
      <input type="radio" name="tier" value="${esc(t.id)}" ${t.id === tierId ? 'checked' : ''}>
      <span>
        <span class="t-name">${esc(t.label)}</span><br>
        <span class="t-note">${esc(t.note)}</span>
      </span>
      <span class="t-price">${esc(money(t.price, ev.currency))}</span>
    </label>`).join('');

  document.getElementById('tiers').addEventListener('change', e => {
    tierId = e.target.value;
    updateSummary();
  });
  document.getElementById('minus').addEventListener('click', () => setQty(qty - 1));
  document.getElementById('plus').addEventListener('click', () => setQty(qty + 1));

  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    if (!e.target.reportValidity()) return;
    renderPending(new FormData(e.target).get('email'));
  });

  setQty(1);
}

// A real backend issues the reference and reserves the seats; this stands in
// for that so the confirmation screen has something concrete to show.
function makeReference() {
  const rand = Math.random().toString(36).slice(2, 7).toUpperCase();
  const day = new Date().toISOString().slice(2, 10).replace(/-/g, '');
  return `${DATA.payment.referencePrefix}-${day}-${rand}`;
}

function renderPending(email) {
  const ev = EVENT, t = totals(), cur = ev.currency;
  const isLottery = ev.status === 'lottery';
  const acct = DATA.payment.accounts[cur];
  const ref = makeReference();

  const due = new Date(Date.now() + DATA.payment.deadlineHours * 3600 * 1000);
  const dueText = due.toLocaleString('en', {
    weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  const rows = acct ? [
    ['Bank', acct.bankName],
    ['Branch', acct.branch],
    ['Account type', acct.accountType],
    ['Account number', acct.accountNumber, true],
    ['Account name', acct.accountName],
  ] : [];

  document.getElementById('main').innerHTML = `
  <div class="pending">
    <div class="pending-head">
      <div class="mark">${isLottery ? '🎟️' : '🏦'}</div>
      <h2>${isLottery ? 'Entry received' : 'Order placed — now transfer the total'}</h2>
      <p>${isLottery
        ? `We will email the result to ${esc(email || 'your address')}. Winners get transfer details with it.`
        : `We have held your seats and emailed these details to ${esc(email || 'your address')}.`}</p>
    </div>

    ${isLottery ? '' : `
    <div class="callout">
      <span class="k">Amount to transfer</span>
      <span class="v">${esc(money(t.total, cur))}</span>
      <span class="sub">${esc(t.tier.label)} × ${qty} · fees included</span>
    </div>

    <div class="callout">
      <span class="k">Payment reference</span>
      <span class="v ref">${esc(ref)}<button class="copy" type="button" data-copy="${esc(ref)}">Copy</button></span>
      <span class="sub">Put this in the transfer memo so we can match your payment</span>
    </div>

    <div class="panel">
      <h3>Transfer to</h3>
      <p class="hint">Due by ${esc(dueText)} · ${DATA.payment.deadlineHours} hours from now</p>
      <table class="bank">
        ${rows.map(([k, v, copyable]) => `
          <tr><th>${esc(k)}</th><td>${esc(v)}${
            copyable ? `<button class="copy" type="button" data-copy="${esc(v)}">Copy</button>` : ''
          }</td></tr>`).join('')}
      </table>
    </div>

    <div class="panel">
      <h3>What happens next</h3>
      <ul class="steps">
        <li><span><b>Transfer the exact amount</b>A different amount cannot be matched automatically and will delay your tickets.</span></li>
        <li><span><b>We confirm receipt</b>Usually within one business day. You get an email either way.</span></li>
        <li><span><b>Tickets are issued</b>Sent to ${esc(email || 'your email address')} once the transfer clears.</span></li>
      </ul>
    </div>

    <div class="warn">
      <b>Seats are released if the transfer does not arrive by ${esc(dueText)}.</b>
      Transfer fees charged by your bank are yours to cover — send the full total
      so the amount we receive matches the order.
    </div>`}

    <div class="warn" style="margin-top:16px">
      <b>Demo build.</b> The account details above are placeholders and the
      reference is generated in the browser. Replace the <code>payment</code>
      block in <code>data.json</code> with real details, and issue references
      from a backend that can reconcile them against your bank statement,
      before taking any order.
    </div>

    <div style="text-align:center;margin-top:26px">
      <a class="btn btn-ghost" href="#/">Back to all events</a>
    </div>
  </div>`;

  document.getElementById('main').addEventListener('click', e => {
    const btn = e.target.closest('.copy');
    if (!btn) return;
    navigator.clipboard?.writeText(btn.dataset.copy).then(() => {
      const was = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = was; }, 1400);
    }, () => {});
  });

  window.scrollTo(0, 0);
}

function setQty(n) {
  qty = Math.min(DATA.checkout.maxPerOrder, Math.max(1, n));
  document.getElementById('qtyOut').textContent = qty;
  document.getElementById('minus').disabled = qty <= 1;
  document.getElementById('plus').disabled = qty >= DATA.checkout.maxPerOrder;
  updateSummary();
}

function totals() {
  const tier = EVENT.tiers.find(t => t.id === tierId);
  const subtotal = tier.price * qty;
  const service = Math.round(subtotal * DATA.checkout.serviceFeeRate);
  const booking = (DATA.checkout.bookingFee[EVENT.currency] ?? 0) * qty;
  return { tier, subtotal, service, booking, total: subtotal + service + booking };
}

function updateSummary() {
  const ev = EVENT, t = totals();
  const cur = ev.currency;
  const isLottery = ev.status === 'lottery';

  document.getElementById('rows').innerHTML = `
    <div class="row"><span>${esc(t.tier.label)} × ${qty}</span><span>${esc(money(t.subtotal, cur))}</span></div>
    <div class="row"><span>Service fee</span><span>${esc(money(t.service, cur))}</span></div>
    <div class="row"><span>Booking fee</span><span>${esc(money(t.booking, cur))}</span></div>`;

  document.getElementById('total').textContent = money(t.total, cur);
  document.getElementById('submit').textContent = isLottery ? 'Enter lottery' : 'Place order';
  document.getElementById('terms').textContent = isLottery
    ? `Free to enter. You pay ${money(t.total, cur)} by transfer only if you win.`
    : `Nothing is charged now. You transfer ${money(t.total, cur)} within ${DATA.payment.deadlineHours} hours to confirm.`;
}
return { boot };
})();

// Stands in for real page navigation: the hosted site loads
// checkout.html?event=<id>, this file swaps views on #/checkout/<id>.
function route() {
  const m = location.hash.match(/^#\/checkout\/(.+)$/);
  const home = document.getElementById('view-home');
  const co   = document.getElementById('view-checkout');
  if (m) {
    CURRENT_ID = decodeURIComponent(m[1]);
    home.hidden = true; co.hidden = false;
    Checkout.boot();
  } else {
    co.hidden = true; home.hidden = false;
  }
  window.scrollTo(0, 0);
}

Home.boot();
addEventListener('hashchange', route);
route();
</script>
