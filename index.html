<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FC liveHub Online — Live Tickets</title>
<meta name="description" content="Concert and live event tickets.">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#" id="brand"></a>
    <nav>
      <a href="#events">Events</a>
      <a href="#faq">FAQ</a>
      <a href="#support">Support</a>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <p class="eyebrow" id="heroEyebrow"></p>
    <h1 id="heroHeading"></h1>
    <p id="heroSub"></p>
    <div class="btns" id="heroBtns"></div>
  </div>
</section>

<main class="wrap" id="events">
  <div class="controls">
    <div class="chips" id="filters"></div>
    <input class="search" id="search" type="search" placeholder="Search artist, venue, city…" aria-label="Search events">
  </div>
  <h2 id="count"></h2>
  <ul class="list" id="list"></ul>
</main>

<section class="wrap faq" id="faq">
  <h2>Frequently asked</h2>
  <div id="faqList"></div>
</section>

<footer id="support">
  <div class="wrap">
    <div class="fcols" id="fcols"></div>
    <div class="fnote" id="fnote"></div>
  </div>
</footer>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

const money = (amount, currency) =>
  new Intl.NumberFormat('en', { style: 'currency', currency, maximumFractionDigits: 0 }).format(amount);

let DATA, activeFilter = 'all', query = '';

fetch('data.json')
  .then(r => r.json())
  .then(data => { DATA = data; boot(); })
  .catch(() => {
    document.getElementById('list').innerHTML =
      '<li class="empty">Could not load data.json. Serve this page over HTTP rather than opening the file directly.</li>';
  });

function boot() {
  const { site, statuses, faq } = DATA;

  document.title = site.title;
  const desc = document.querySelector('meta[name=description]');
  if (desc) desc.content = site.description;
  document.getElementById('brand').innerHTML =
    `${esc(site.brand)} <span>${esc(site.tagline)}</span>`;

  document.getElementById('heroEyebrow').textContent = site.hero.eyebrow;
  document.getElementById('heroHeading').textContent = site.hero.heading;
  document.getElementById('heroSub').textContent = site.hero.sub;
  document.getElementById('heroBtns').innerHTML = `
    <a class="btn btn-primary" href="${esc(site.hero.primaryCta.href)}">${esc(site.hero.primaryCta.label)}</a>
    <a class="btn btn-ghost" href="${esc(site.hero.secondaryCta.href)}">${esc(site.hero.secondaryCta.label)}</a>`;

  // Filters: All + one per status + one per genre.
  const filters = [
    { key: 'all', label: 'All events' },
    ...Object.entries(statuses).map(([key, s]) => ({ key: 'status:' + key, label: s.label })),
    ...DATA.genres.map(g => ({ key: 'genre:' + g, label: g })),
  ];
  document.getElementById('filters').innerHTML = filters.map(f =>
    `<button class="chip" data-key="${esc(f.key)}" aria-pressed="${f.key === 'all'}">${esc(f.label)}</button>`
  ).join('');

  document.getElementById('filters').addEventListener('click', e => {
    const btn = e.target.closest('.chip');
    if (!btn) return;
    activeFilter = btn.dataset.key;
    document.querySelectorAll('.chip').forEach(c =>
      c.setAttribute('aria-pressed', c === btn));
    render();
  });

  document.getElementById('search').addEventListener('input', e => {
    query = e.target.value.trim().toLowerCase();
    render();
  });

  document.getElementById('faqList').innerHTML = faq.map(f =>
    `<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join('');

  document.getElementById('fcols').innerHTML = site.footer.columns.map(col => `
    <div class="fcol">
      <h4>${esc(col.title)}</h4>
      ${col.links.map(l => `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('')}
    </div>`).join('');
  document.getElementById('fnote').textContent =
    `© ${new Date().getFullYear()} ${site.brand}. ${site.footer.note}`;

  render();
}

function matches(ev) {
  if (activeFilter.startsWith('status:') && ev.status !== activeFilter.slice(7)) return false;
  if (activeFilter.startsWith('genre:') && ev.genre !== activeFilter.slice(6)) return false;
  if (!query) return true;
  return [ev.artist, ev.title, ev.venue, ev.city, ev.genre]
    .join(' ').toLowerCase().includes(query);
}

function render() {
  const shown = DATA.events
    .filter(matches)
    .sort((a, b) => a.date.localeCompare(b.date));

  document.getElementById('count').textContent =
    shown.length ? `${shown.length} event${shown.length > 1 ? 's' : ''}` : '';

  document.getElementById('list').innerHTML = shown.length
    ? shown.map(card).join('')
    : '<li class="empty">No events match those filters.</li>';
}

function card(ev) {
  const d = new Date(ev.date + 'T00:00:00');
  const status = DATA.statuses[ev.status] ?? { label: ev.status, tone: 'grey' };
  const closed = ev.status === 'soldout' || ev.status === 'soon';
  const cta = ev.status === 'lottery' ? 'Enter lottery'
            : ev.status === 'soldout' ? 'Sold out'
            : ev.status === 'soon'    ? 'Not yet on sale'
            : 'Buy tickets';
  // Closed events keep a dead link; the rest carry their id into checkout.
  const href = closed ? '#' : `checkout.html?event=${encodeURIComponent(ev.id)}`;

  return `
  <li class="event">
    <div class="date">
      <div class="mon">${d.toLocaleString('en', { month: 'short' })}</div>
      <div class="day">${d.getDate()}</div>
      <div class="dow">${d.toLocaleString('en', { weekday: 'short' })} ${d.getFullYear()}</div>
    </div>
    <div class="meta">
      <h3><span class="artist">${esc(ev.artist)}</span> — ${esc(ev.title)}</h3>
      <div class="sub">${esc(ev.venue)}, ${esc(ev.city)} · Doors ${esc(ev.doors)} / Start ${esc(ev.start)}</div>
      ${ev.note ? `<div class="note">${esc(ev.note)}</div>` : ''}
    </div>
    <div class="right">
      <span class="tag ${esc(status.tone)}">${esc(status.label)}</span>
      <span class="price">from <b>${esc(money(ev.priceFrom, ev.currency))}</b></span>
      <a class="btn btn-primary buy" href="${esc(href)}" data-disabled="${closed}">${cta}</a>
    </div>
  </li>`;
}
</script>
</body>
</html>
